name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Test
        run: swift test
      - name: Build
        env:
          SIGNING_IDENTITY: "-"
        run: ./Scripts/build-app.sh
      - name: Verify standalone bundle
        run: |
          plutil -lint "dist/Mac Input Lock.app/Contents/Info.plist"
          codesign --verify --deep --strict "dist/Mac Input Lock.app"
          test ! -d "dist/Mac Input Lock.app/Contents/Frameworks"
          ! /usr/libexec/PlistBuddy -c 'Print SUFeedURL' "dist/Mac Input Lock.app/Contents/Info.plist"
